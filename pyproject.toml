[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sales-prediction"
dynamic = ["version"]
description = "Prédiction des ventes à partir des budgets publicitaires : pipeline ML, analyse d'impact et API."
readme = "README.md"
# Version de Python FIXÉE (3.12.x) : identique en local (.python-version), dans Docker et sur Render.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13",
    "joblib>=1.4",
    "pyyaml>=6.0",
]

[project.scripts]
sales-train = "sales_prediction.train:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Exploration uniquement (non installé dans Docker) : `uv sync --group notebook`
notebook = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[tool.hatch.version]
path = "src/sales_prediction/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_prediction"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # longueur des lignes gérée par `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
source = ["sales_prediction"]

[tool.coverage.report]
fail_under = 75
