# Blueprint Render : déploiement via Docker (le Dockerfile entraîne le modèle pendant le build).
# Render > New + > Blueprint > choisir le dépôt GitHub > Apply.
services:
  - type: web
    name: sales-prediction-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

